name: Deploy Kios Frontend Pickupboard to DEV Environment

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the freshly built dev-<sha>)"
        required: false
        default: ""

env:
  environment: dev
  DEV_AKS_RESOURCE_GROUP: ${{ secrets.DEV_AKS_RESOURCE_GROUP }}
  DEV_AKS_CLUSTER_NAME: ${{ secrets.DEV_AKS_CLUSTER_NAME }}
  NAMESPACE: pickupboard-dev
  ACR_NAME: ${{ secrets.DEV_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.DEV_ACR_LOGIN_SERVER }}
  DEPLOYMENT_NAME: kios-frontend-pickupboard-dev

concurrency:
  group: dev-deploy-kios-frontend-pickupboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Service principal JSON stored as DEV_AZURE_CREDENTIALS (shared with backend)
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.DEV_AZURE_CREDENTIALS }}

      - name: Generate image tag
        id: image_tag
        shell: bash
        run: |
          IMAGE_TAG="dev-${GITHUB_SHA::7}"
          echo "Generated image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ env.ACR_NAME }}"

      # Vite bakes the service URLs at build time -> pass them as Docker build args.
      # Values are deployed endpoints, never localhost/raw IPs.
      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/kios-frontend-pickupboard:${{ steps.image_tag.outputs.image_tag }}"
          docker build \
            --build-arg VITE_AUTH_API_BASE_URL="${{ secrets.DEV_AUTH_API_BASE_URL }}" \
            --build-arg VITE_WEBSOCKET_URL="${{ secrets.DEV_WEBSOCKET_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.DEV_AKS_RESOURCE_GROUP }} \
            --name ${{ env.DEV_AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install kubelogin
        run: sudo az aks install-cli

      - name: Convert kubeconfig for AAD auth
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Verify cluster connection
        run: kubectl cluster-info

      # Namespace is created by the infra repo (kios-infra / aks-namespaces.tf).
      # Here we only VERIFY it exists — fail fast if infra hasn't been applied yet.
      - name: Verify namespace exists (created by infra)
        run: |
          if ! kubectl get namespace ${{ env.NAMESPACE }}; then
            echo "::error::Namespace '${{ env.NAMESPACE }}' not found. Apply kios-infra (aks-namespaces.tf) first."
            exit 1
          fi

      - name: Deploy application (Deployment + Service)
        run: kubectl apply -f k8s/dev/deployment.yaml

      - name: Set image tag
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${{ steps.image_tag.outputs.image_tag }}"
          fi
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.DEPLOYMENT_NAME }}=${{ env.ACR_LOGIN_SERVER }}/kios-frontend-pickupboard:${IMAGE_TAG} \
            -n ${{ env.NAMESPACE }}

      - name: Apply ingress
        run: kubectl apply -f k8s/dev/ingress.yaml

      - name: Apply autoscaling (HPA + PDB)
        run: kubectl apply -f k8s/dev/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify pods
        if: always()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }} -o wide
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -n 20
